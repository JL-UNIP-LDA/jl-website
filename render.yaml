services:
  - type: web
    name: jl-energy-website
    env: node
    plan: free
    buildCommand: echo "No build needed — dist is pre-built (Astro static + zero-dependency server)"
    startCommand: node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
